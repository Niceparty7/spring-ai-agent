<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 AI 助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f6f8;
            --panel: #ffffff;
            --line: #e3e6ea;
            --text: #1f2328;
            --muted: #6b7280;
            --brand: #2f6fed;
            --brand-soft: #eaf1fe;
            --ok: #1f8f4e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }

        .app {
            width: 100%;
            max-width: 780px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 64px);
            min-height: 560px;
            overflow: hidden;
        }

        header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dot {
            width: 34px; height: 34px;
            border-radius: 9px;
            background: var(--brand-soft);
            color: var(--brand);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 15px;
            flex: 0 0 auto;
        }

        header h1 { font-size: 15px; font-weight: 600; }
        header p { font-size: 12px; color: var(--muted); margin-top: 2px; }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg { display: flex; gap: 10px; max-width: 100%; }
        .msg.me { flex-direction: row-reverse; }

        .bubble {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 78%;
        }

        .msg.bot .bubble { background: #f2f4f7; border: 1px solid var(--line); }
        .msg.me  .bubble { background: var(--brand); color: #fff; }

        .avatar {
            width: 28px; height: 28px; flex: 0 0 auto;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600;
            background: #eceff3; color: var(--muted);
        }
        .msg.me .avatar { background: var(--brand); color: #fff; }

        .hint { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0 2px; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 22px 12px; }

        .chip {
            font-size: 12px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--muted);
            cursor: pointer;
            transition: all .15s;
        }
        .chip:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

        footer {
            border-top: 1px solid var(--line);
            padding: 12px 22px 16px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            resize: none;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 11px 13px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            max-height: 130px;
            outline: none;
            color: var(--text);
        }
        textarea:focus { border-color: var(--brand); }

        button {
            border: 0;
            background: var(--brand);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 11px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity .15s;
        }
        button:disabled { opacity: .5; cursor: not-allowed; }

        .loading { display: inline-flex; gap: 4px; align-items: center; }
        .loading i {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--muted); opacity: .4;
            animation: blink 1.2s infinite;
        }
        .loading i:nth-child(2) { animation-delay: .2s; }
        .loading i:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: .9 } }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="dot">AI</div>
        <div>
            <h1>商品管理 AI 助手</h1>
            <p>用自然语言操作商品数据 · Powered by Spring AI + 通义千问</p>
        </div>
    </header>

    <div id="messages"></div>

    <div class="chips" id="chips">
        <span class="chip">帮我看看现在有哪些商品</span>
        <span class="chip">查一下 ID 为 1 的商品详情</span>
        <span class="chip">新增一个商品：USB-C 扩展坞，价格 199，库存 50</span>
        <span class="chip">把 ID 为 2 的商品价格改成 199</span>
        <span class="chip">删除 ID 为 3 的商品</span>
    </div>

    <footer>
        <textarea id="input" rows="1" placeholder="例如：帮我看看现在有哪些商品（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send">发送</button>
    </footer>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let busy = false;

    function addMessage(text, who) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + who;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = who === 'me' ? '我' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return bubble;
    }

    function setBusy(v) {
        busy = v;
        sendBtn.disabled = v;
        inputEl.disabled = v;
    }

    async function send(text) {
        const content = (text !== undefined ? text : inputEl.value).trim();
        if (!content || busy) return;

        addMessage(content, 'me');
        inputEl.value = '';
        inputEl.style.height = 'auto';
        setBusy(true);

        const bubble = addMessage('', 'bot');
        bubble.innerHTML = '<span class="loading"><i></i><i></i><i></i></span>';

        try {
            const resp = await fetch('/api/agent/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: content })
            });
            if (!resp.ok) {
                throw new Error('HTTP ' + resp.status);
            }
            const data = await resp.json();
            bubble.textContent = data.reply || '（无返回内容）';
        } catch (e) {
            bubble.textContent = '请求失败：' + e.message +
                '\n请确认后端已启动、AI_DASHSCOPE_API_KEY 已配置且有效。';
        } finally {
            setBusy(false);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
    }

    sendBtn.addEventListener('click', () => send());

    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });

    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
    });

    document.getElementById('chips').addEventListener('click', e => {
        if (e.target.classList.contains('chip')) {
            send(e.target.textContent);
        }
    });

    addMessage('你好，我是商品管理助手。你可以让我查询、新增、改价或删除商品，试试下面的示例～', 'bot');
</script>
</body>
</html>
