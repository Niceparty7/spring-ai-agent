<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 AI 助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f6f8;
            --panel: #ffffff;
            --line: #e3e6ea;
            --text: #1f2328;
            --muted: #6b7280;
            --brand: #2f6fed;
            --brand-soft: #eaf1fe;
            --ok: #1f8f4e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }

        .app {
            width: 100%;
            max-width: 780px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 64px);
            min-height: 560px;
            overflow: hidden;
        }

        header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dot {
            width: 34px; height: 34px;
            border-radius: 9px;
            background: var(--brand-soft);
            color: var(--brand);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 15px;
            flex: 0 0 auto;
        }

        header h1 { font-size: 15px; font-weight: 600; }
        header p { font-size: 12px; color: var(--muted); margin-top: 2px; }

        /* 「新对话」按钮：推到 header 最右，并覆盖默认 button 的实心蓝样式 */
        #newChat {
            margin-left: auto;
            background: #fff;
            color: var(--brand);
            border: 1px solid var(--line);
            padding: 7px 14px;
            font-size: 13px;
        }
        #newChat:hover { border-color: var(--brand); background: var(--brand-soft); }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg { display: flex; gap: 10px; max-width: 100%; }
        .msg.me { flex-direction: row-reverse; }

        .bubble {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 78%;
        }

        .msg.bot .bubble { background: #f2f4f7; border: 1px solid var(--line); }
        .msg.me  .bubble { background: var(--brand); color: #fff; }

        .avatar {
            width: 28px; height: 28px; flex: 0 0 auto;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600;
            background: #eceff3; color: var(--muted);
        }
        .msg.me .avatar { background: var(--brand); color: #fff; }

        .hint { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0 2px; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 22px 12px; }

        .chip {
            font-size: 12px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--muted);
            cursor: pointer;
            transition: all .15s;
        }
        .chip:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

        footer {
            border-top: 1px solid var(--line);
            padding: 12px 22px 16px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            resize: none;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 11px 13px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            max-height: 130px;
            outline: none;
            color: var(--text);
        }
        textarea:focus { border-color: var(--brand); }

        button {
            border: 0;
            background: var(--brand);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 11px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity .15s;
        }
        button:disabled { opacity: .5; cursor: not-allowed; }

        .loading { display: inline-flex; gap: 4px; align-items: center; }
        .loading i {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--muted); opacity: .4;
            animation: blink 1.2s infinite;
        }
        .loading i:nth-child(2) { animation-delay: .2s; }
        .loading i:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: .9 } }

        /* ==================== 知识库面板 ==================== */
        /* 与「新对话」并列的按钮 */
        #kbToggle {
            background: #fff;
            color: var(--brand);
            border: 1px solid var(--line);
            padding: 7px 14px;
            font-size: 13px;
        }
        #kbToggle:hover, #kbToggle.active { border-color: var(--brand); background: var(--brand-soft); }

        /* 抽屉：从右侧滑出，盖住整个 .app 视觉区域（fixed 定位避免影响聊天区布局） */
        #kbPanel {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 420px;
            max-width: 92vw;
            background: #fff;
            border-left: 1px solid var(--line);
            box-shadow: -8px 0 28px rgba(15, 23, 42, .12);
            transform: translateX(102%);
            transition: transform .22s ease;
            z-index: 50;
            display: flex;
            flex-direction: column;
        }
        #kbPanel.open { transform: translateX(0); }

        .kb-head {
            padding: 16px 18px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .kb-head h2 { font-size: 14px; font-weight: 600; }
        .kb-head .stat { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .kb-head .close {
            margin-left: auto;
            background: #fff; color: var(--muted);
            border: 1px solid var(--line);
            padding: 5px 11px; font-size: 13px; border-radius: 8px;
        }
        .kb-head .close:hover { color: var(--brand); border-color: var(--brand); }

        .kb-body { flex: 1; overflow-y: auto; padding: 16px 18px 24px; }

        .kb-section { margin-bottom: 22px; }
        .kb-section > h3 {
            font-size: 12px; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: .04em;
            margin-bottom: 9px;
        }

        .kb-row { display: flex; gap: 8px; align-items: center; }
        .kb-row + .kb-row { margin-top: 8px; }

        .kb-input {
            flex: 1; min-width: 0;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 11px;
            font-family: inherit; font-size: 13px;
            color: var(--text); outline: none;
            background: #fff;
        }
        .kb-input:focus { border-color: var(--brand); }
        .kb-input.narrow { flex: 0 0 68px; }

        .kb-file {
            flex: 1; min-width: 0;
            font-size: 12px; color: var(--muted);
        }

        .kb-btn {
            background: var(--brand); color: #fff;
            border: 0; padding: 8px 14px;
            font-size: 13px; border-radius: 8px; font-weight: 500;
            cursor: pointer; white-space: nowrap;
        }
        .kb-btn:disabled { opacity: .5; cursor: not-allowed; }
        .kb-btn.ghost {
            background: #fff; color: var(--brand); border: 1px solid var(--line);
        }
        .kb-btn.ghost:hover { border-color: var(--brand); background: var(--brand-soft); }

        .kb-note { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
        .kb-note.error { color: #b42318; }
        .kb-note.ok { color: var(--ok); }

        .kb-doc {
            display: flex; align-items: center; gap: 9px;
            border: 1px solid var(--line); border-radius: 9px;
            padding: 9px 11px; font-size: 13px;
        }
        .kb-doc + .kb-doc { margin-top: 7px; }
        .kb-doc .name {
            flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .kb-doc .meta { font-size: 11px; color: var(--muted); flex: 0 0 auto; }
        .kb-doc .del {
            background: #fff; color: #b42318;
            border: 1px solid var(--line);
            padding: 3px 9px; font-size: 12px; border-radius: 7px; cursor: pointer;
            flex: 0 0 auto;
        }
        .kb-doc .del:hover { border-color: #b42318; background: #fef3f2; }

        .kb-hit {
            border: 1px solid var(--line); border-radius: 9px;
            padding: 10px 12px; font-size: 13px;
        }
        .kb-hit + .kb-hit { margin-top: 8px; }
        .kb-hit .hit-head {
            display: flex; gap: 8px; align-items: baseline;
            font-size: 11px; color: var(--muted); margin-bottom: 5px;
        }
        .kb-hit .score {
            margin-left: auto; flex: 0 0 auto;
            font-weight: 600; color: var(--brand);
        }
        .kb-hit .hit-text {
            white-space: pre-wrap; word-break: break-word;
            line-height: 1.6; max-height: 160px; overflow-y: auto;
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="dot">AI</div>
        <div>
            <h1>商品管理 AI 助手</h1>
            <p>用自然语言操作商品数据 · Powered by Spring AI + 通义千问</p>
        </div>
        <!-- 知识库按钮：展开右侧管理面板 -->
        <button id="kbToggle" type="button">知识库</button>
        <!-- 新对话按钮：点后重置会话并清理后端记忆 -->
        <button id="newChat" type="button">新对话</button>
    </header>

    <div id="messages"></div>

    <div class="chips" id="chips">
        <span class="chip">帮我看看现在有哪些商品</span>
        <span class="chip">查一下 ID 为 1 的商品详情</span>
        <span class="chip">新增一个商品：USB-C 扩展坞，价格 199，库存 50</span>
        <span class="chip">把 ID 为 2 的商品价格改成 199</span>
        <span class="chip">删除 ID 为 3 的商品</span>
        <span class="chip">根据知识库回答：文档里讲了什么？</span>
    </div>

    <footer>
        <textarea id="input" rows="1" placeholder="例如：帮我看看现在有哪些商品（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send">发送</button>
    </footer>
</div>

<!-- ==================== 知识库管理面板 ==================== -->
<div id="kbPanel">
    <div class="kb-head">
        <div>
            <h2>知识库</h2>
            <div class="stat" id="kbStats">文档 0 篇 / 分片 0 段</div>
        </div>
        <button class="close" id="kbClose" type="button">收起</button>
    </div>

    <div class="kb-body">
        <!-- 上传 -->
        <div class="kb-section">
            <h3>上传文档</h3>
            <div class="kb-row">
                <input type="file" id="kbFile" class="kb-file" accept=".txt,.md,.pdf" multiple>
                <button class="kb-btn" id="kbUpload" type="button">上传</button>
            </div>
            <div class="kb-note" id="kbUploadNote">支持 txt / md / pdf，单文件不超过 20 MB。上传后自动切分并向量化入库。</div>
        </div>

        <!-- 文档列表 -->
        <div class="kb-section">
            <h3>已入库文档</h3>
            <div id="kbDocs"><div class="kb-note">加载中…</div></div>
        </div>

        <!-- 检索测试 -->
        <div class="kb-section">
            <h3>检索测试</h3>
            <div class="kb-row">
                <input type="text" id="kbQuery" class="kb-input" placeholder="输入检索问题，如：向量存储">
            </div>
            <div class="kb-row">
                <span class="kb-note" style="margin:0">topK</span>
                <input type="number" id="kbTopK" class="kb-input narrow" value="4" min="1" max="20">
                <span class="kb-note" style="margin:0">阈值</span>
                <input type="number" id="kbThreshold" class="kb-input narrow" value="0.5" min="0" max="1" step="0.05">
                <button class="kb-btn" id="kbSearch" type="button">检索</button>
            </div>
            <div id="kbHits" style="margin-top:10px"></div>
        </div>
    </div>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let busy = false;

    // ===== 会话 ID 管理：UUID + localStorage =====
    const STORAGE_KEY = 'agent_demo_conversation_id';

    // 生成 UUID；优先原生 API，老浏览器降级到手写 v4
    function genConversationId() {
        if (window.crypto && typeof crypto.randomUUID === 'function') {
            return crypto.randomUUID();
        }
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
            const r = (Math.random() * 16) | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    // 读取已有会话 ID；没有则生成并持久化
    function loadConversationId() {
        let id = localStorage.getItem(STORAGE_KEY);
        if (!id) {
            id = genConversationId();
            localStorage.setItem(STORAGE_KEY, id);
        }
        return id;
    }

    let conversationId = loadConversationId();

    function addMessage(text, who) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + who;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = who === 'me' ? '我' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return bubble;
    }

    function setBusy(v) {
        busy = v;
        sendBtn.disabled = v;
        inputEl.disabled = v;
    }

    async function send(text) {
        const content = (text !== undefined ? text : inputEl.value).trim();
        if (!content || busy) return;

        addMessage(content, 'me');
        inputEl.value = '';
        inputEl.style.height = 'auto';
        setBusy(true);

        // 先放占位提示：模型调工具期间会有数秒无任何输出，用它告诉用户"正在处理"
        const bubble = addMessage('正在处理…', 'bot');
        let acc = '';          // 已累积的文本
        let gotFirst = false;  // 是否已收到过内容（用于替换占位提示）

        // 消费一个 SSE 帧。
        // 实测确认 Spring MVC 写出的格式为 data:<值>（冒号后**无**空格），
        // 值内的换行会被拆成多行 data:，因此这里把多行按顺序拼回。
        function consumeFrame(frame) {
            if (frame === '') return;
            const piece = frame.split('\n')
                .map(line => line.startsWith('data:') ? line.slice(5) : line)
                .join('\n');
            if (piece === '') return;

            if (!gotFirst) { bubble.textContent = ''; gotFirst = true; }

            // 后端在流中途失败时会推一条以该前缀开头的提示，需与正文分隔并标色
            if (piece.startsWith('[流式输出中断：')) {
                acc += (acc ? '\n\n' : '') + piece;
                bubble.style.color = '#b42318';
            } else {
                acc += piece;
                bubble.style.color = '';
            }
            bubble.textContent = acc;
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        try {
            const resp = await fetch('/api/agent/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // 每次请求都带当前会话 ID，后端据此隔离/拼接历史
                body: JSON.stringify({ message: content, conversationId: conversationId })
            });
            if (!resp.ok) {
                throw new Error('HTTP ' + resp.status);
            }
            if (!resp.body) {
                throw new Error('当前浏览器不支持流式读取');
            }

            const reader = resp.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';   // 尚未成帧的残留

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                // stream: true 让跨 chunk 截断的多字节 UTF-8 字符能正确拼接
                buffer += decoder.decode(value, { stream: true });

                // SSE 以空行分帧
                let sep;
                while ((sep = buffer.indexOf('\n\n')) >= 0) {
                    const frame = buffer.slice(0, sep);
                    buffer = buffer.slice(sep + 2);
                    consumeFrame(frame);
                }
            }
            // 收尾：处理未以空行结束的尾帧
            if (buffer.trim() !== '') {
                consumeFrame(buffer);
            }
            if (!acc) {
                bubble.textContent = '（模型未返回内容）';
            }
        } catch (e) {
            // 已流出的内容尽量保留，仅在末尾追加错误提示
            bubble.textContent = (acc ? acc + '\n\n' : '') + '请求失败：' + e.message +
                '\n请确认后端已启动、AI_DASHSCOPE_API_KEY 已配置且有效。';
            bubble.style.color = '#b42318';
        } finally {
            setBusy(false);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
    }

    sendBtn.addEventListener('click', () => send());

    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });

    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
    });

    document.getElementById('chips').addEventListener('click', e => {
        if (e.target.classList.contains('chip')) {
            send(e.target.textContent);
        }
    });

    // 新对话：清理后端旧会话内存 -> 生成并保存新 ID -> 清空消息区 -> 重新欢迎
    async function resetConversation() {
        const oldId = conversationId;
        try {
            await fetch('/api/agent/conversation?conversationId=' + encodeURIComponent(oldId),
                { method: 'DELETE' });
        } catch (e) { /* 后端清理失败也不阻断前端重置 */ }
        conversationId = genConversationId();
        localStorage.setItem(STORAGE_KEY, conversationId);
        messagesEl.innerHTML = '';
        addMessage('已开启新对话。你可以继续查询、新增、改价或删除商品～', 'bot');
    }

    document.getElementById('newChat').addEventListener('click', resetConversation);

    addMessage('你好，我是商品管理助手。你可以让我查询、新增、改价或删除商品，试试下面的示例～', 'bot');

    // ==================== 知识库面板 ====================
    const kbPanel = document.getElementById('kbPanel');
    const kbToggle = document.getElementById('kbToggle');
    const kbDocsEl = document.getElementById('kbDocs');
    const kbHitsEl = document.getElementById('kbHits');
    const kbStatsEl = document.getElementById('kbStats');
    const kbUploadNote = document.getElementById('kbUploadNote');

    // 打开面板时按需加载数据，避免页面加载即发请求
    let kbLoaded = false;
    function openKb() {
        kbPanel.classList.add('open');
        kbToggle.classList.add('active');
        if (!kbLoaded) { kbLoaded = true; refreshKb(); }
    }
    function closeKb() {
        kbPanel.classList.remove('open');
        kbToggle.classList.remove('active');
    }
    kbToggle.addEventListener('click', () => {
        kbPanel.classList.contains('open') ? closeKb() : openKb();
    });
    document.getElementById('kbClose').addEventListener('click', closeKb);

    /** 统一的 JSON 请求：非 2xx 时把后端返回的 message 抛出来，便于在 UI 上展示原因。 */
    async function kbFetch(url, options) {
        const resp = await fetch(url, options);
        if (!resp.ok) {
            let detail = 'HTTP ' + resp.status;
            try {
                const text = await resp.text();
                if (text) detail += '：' + text.replace(/\s+/g, ' ').slice(0, 220);
            } catch (e) { /* 忽略解析失败 */ }
            throw new Error(detail);
        }
        return resp.json();
    }

    function setNote(el, msg, kind) {
        el.textContent = msg;
        el.className = 'kb-note' + (kind ? ' ' + kind : '');
    }

    async function refreshKb() {
        await Promise.all([loadDocList(), loadStats()]);
    }

    async function loadStats() {
        try {
            const s = await kbFetch('/api/kb/stats');
            kbStatsEl.textContent = '文档 ' + s.documentCount + ' 篇 / 分片 ' + s.chunkCount + ' 段';
        } catch (e) {
            kbStatsEl.textContent = '统计获取失败';
        }
    }

    async function loadDocList() {
        try {
            const list = await kbFetch('/api/kb/documents');
            renderDocList(list);
        } catch (e) {
            kbDocsEl.innerHTML = '';
            const d = document.createElement('div');
            d.className = 'kb-note error';
            d.textContent = '加载失败：' + e.message;
            kbDocsEl.appendChild(d);
        }
    }

    function renderDocList(list) {
        kbDocsEl.innerHTML = '';
        if (!list || list.length === 0) {
            const d = document.createElement('div');
            d.className = 'kb-note';
            d.textContent = '还没有文档，先上传一个试试。';
            kbDocsEl.appendChild(d);
            return;
        }
        list.forEach(doc => {
            const row = document.createElement('div');
            row.className = 'kb-doc';

            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = doc.fileName;
            name.title = doc.fileName;

            const meta = document.createElement('span');
            meta.className = 'meta';
            meta.textContent = doc.fileType + ' · ' + doc.chunkCount + ' 段';

            const del = document.createElement('button');
            del.className = 'del';
            del.type = 'button';
            del.textContent = '删除';
            del.addEventListener('click', () => deleteDoc(doc.docId, doc.fileName));

            row.appendChild(name);
            row.appendChild(meta);
            row.appendChild(del);
            kbDocsEl.appendChild(row);
        });
    }

    async function deleteDoc(docId, fileName) {
        if (!confirm('确认删除《' + fileName + '》及其全部分片？此操作不可撤销。')) return;
        try {
            await kbFetch('/api/kb/documents/' + encodeURIComponent(docId), { method: 'DELETE' });
            await refreshKb();
            setNote(kbUploadNote, '已删除《' + fileName + '》。', 'ok');
        } catch (e) {
            setNote(kbUploadNote, '删除失败：' + e.message, 'error');
        }
    }

    // 上传：逐个文件提交，便于定位是哪一个失败
    document.getElementById('kbUpload').addEventListener('click', async () => {
        const fileInput = document.getElementById('kbFile');
        const files = Array.from(fileInput.files || []);
        if (files.length === 0) {
            setNote(kbUploadNote, '请先选择文件。', 'error');
            return;
        }
        const btn = document.getElementById('kbUpload');
        btn.disabled = true;
        let okCount = 0;
        const failures = [];

        for (const f of files) {
            setNote(kbUploadNote, '正在上传并向量化：' + f.name + ' …');
            const fd = new FormData();
            fd.append('file', f);   // 字段名与后端 @RequestParam("file") 对齐
            try {
                // 注意：不要手动设置 Content-Type，浏览器会自动补 multipart boundary
                const r = await kbFetch('/api/kb/documents', { method: 'POST', body: fd });
                okCount++;
                setNote(kbUploadNote,
                    '已入库《' + r.fileName + '》，共 ' + r.chunkCount + ' 段。', 'ok');
            } catch (e) {
                failures.push(f.name + '（' + e.message + '）');
            }
        }

        btn.disabled = false;
        fileInput.value = '';
        if (failures.length > 0) {
            setNote(kbUploadNote, '成功 ' + okCount + ' 个；失败 ' + failures.length + ' 个：'
                + failures.join('；'), 'error');
        }
        await refreshKb();
    });

    function renderHits(hits) {
        kbHitsEl.innerHTML = '';
        if (!hits || hits.length === 0) {
            const d = document.createElement('div');
            d.className = 'kb-note';
            d.textContent = '没有命中任何分片。可尝试降低阈值，或确认该内容已入库。';
            kbHitsEl.appendChild(d);
            return;
        }
        hits.forEach((h, i) => {
            const box = document.createElement('div');
            box.className = 'kb-hit';

            const head = document.createElement('div');
            head.className = 'hit-head';
            const from = document.createElement('span');
            from.textContent = '[' + (i + 1) + '] 《' + (h.fileName || '未知来源') + '》第 ' + (h.chunkIndex ?? '-') + ' 段';
            const score = document.createElement('span');
            score.className = 'score';
            score.textContent = h.score == null ? '' : Number(h.score).toFixed(3);
            head.appendChild(from);
            head.appendChild(score);

            const text = document.createElement('div');
            text.className = 'hit-text';
            text.textContent = h.text;

            box.appendChild(head);
            box.appendChild(text);
            kbHitsEl.appendChild(box);
        });
    }

    document.getElementById('kbSearch').addEventListener('click', async () => {
        const q = document.getElementById('kbQuery').value.trim();
        if (!q) {
            kbHitsEl.innerHTML = '';
            const d = document.createElement('div');
            d.className = 'kb-note error';
            d.textContent = '请输入检索问题。';
            kbHitsEl.appendChild(d);
            return;
        }
        const topK = document.getElementById('kbTopK').value || 4;
        const th = document.getElementById('kbThreshold').value || 0.5;
        // 中文 query 走 URL 参数必须 encodeURIComponent
        const url = '/api/kb/search?query=' + encodeURIComponent(q)
            + '&topK=' + encodeURIComponent(topK) + '&threshold=' + encodeURIComponent(th);
        try {
            renderHits(await kbFetch(url));
        } catch (e) {
            kbHitsEl.innerHTML = '';
            const d = document.createElement('div');
            d.className = 'kb-note error';
            d.textContent = '检索失败：' + e.message;
            kbHitsEl.appendChild(d);
        }
    });

    // 检索输入框回车即触发
    document.getElementById('kbQuery').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('kbSearch').click();
        }
    });
</script>
</body>
</html>
