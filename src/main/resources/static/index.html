<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 AI 助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f6f8;
            --panel: #ffffff;
            --line: #e3e6ea;
            --text: #1f2328;
            --muted: #6b7280;
            --brand: #2f6fed;
            --brand-soft: #eaf1fe;
            --ok: #1f8f4e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }

        .app {
            width: 100%;
            max-width: 780px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 64px);
            min-height: 560px;
            overflow: hidden;
        }

        header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dot {
            width: 34px; height: 34px;
            border-radius: 9px;
            background: var(--brand-soft);
            color: var(--brand);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 15px;
            flex: 0 0 auto;
        }

        header h1 { font-size: 15px; font-weight: 600; }
        header p { font-size: 12px; color: var(--muted); margin-top: 2px; }

        /* 「新对话」按钮：推到 header 最右，并覆盖默认 button 的实心蓝样式 */
        #newChat {
            margin-left: auto;
            background: #fff;
            color: var(--brand);
            border: 1px solid var(--line);
            padding: 7px 14px;
            font-size: 13px;
        }
        #newChat:hover { border-color: var(--brand); background: var(--brand-soft); }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg { display: flex; gap: 10px; max-width: 100%; }
        .msg.me { flex-direction: row-reverse; }

        .bubble {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 78%;
        }

        .msg.bot .bubble { background: #f2f4f7; border: 1px solid var(--line); }
        .msg.me  .bubble { background: var(--brand); color: #fff; }

        .avatar {
            width: 28px; height: 28px; flex: 0 0 auto;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600;
            background: #eceff3; color: var(--muted);
        }
        .msg.me .avatar { background: var(--brand); color: #fff; }

        .hint { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0 2px; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 22px 12px; }

        .chip {
            font-size: 12px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--muted);
            cursor: pointer;
            transition: all .15s;
        }
        .chip:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

        footer {
            border-top: 1px solid var(--line);
            padding: 12px 22px 16px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            resize: none;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 11px 13px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            max-height: 130px;
            outline: none;
            color: var(--text);
        }
        textarea:focus { border-color: var(--brand); }

        button {
            border: 0;
            background: var(--brand);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 11px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity .15s;
        }
        button:disabled { opacity: .5; cursor: not-allowed; }

        .loading { display: inline-flex; gap: 4px; align-items: center; }
        .loading i {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--muted); opacity: .4;
            animation: blink 1.2s infinite;
        }
        .loading i:nth-child(2) { animation-delay: .2s; }
        .loading i:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: .9 } }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="dot">AI</div>
        <div>
            <h1>商品管理 AI 助手</h1>
            <p>用自然语言操作商品数据 · Powered by Spring AI + 通义千问</p>
        </div>
        <!-- 新对话按钮：点后重置会话并清理后端记忆 -->
        <button id="newChat" type="button">新对话</button>
    </header>

    <div id="messages"></div>

    <div class="chips" id="chips">
        <span class="chip">帮我看看现在有哪些商品</span>
        <span class="chip">查一下 ID 为 1 的商品详情</span>
        <span class="chip">新增一个商品：USB-C 扩展坞，价格 199，库存 50</span>
        <span class="chip">把 ID 为 2 的商品价格改成 199</span>
        <span class="chip">删除 ID 为 3 的商品</span>
    </div>

    <footer>
        <textarea id="input" rows="1" placeholder="例如：帮我看看现在有哪些商品（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send">发送</button>
    </footer>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let busy = false;

    // ===== 会话 ID 管理：UUID + localStorage =====
    const STORAGE_KEY = 'agent_demo_conversation_id';

    // 生成 UUID；优先原生 API，老浏览器降级到手写 v4
    function genConversationId() {
        if (window.crypto && typeof crypto.randomUUID === 'function') {
            return crypto.randomUUID();
        }
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
            const r = (Math.random() * 16) | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    // 读取已有会话 ID；没有则生成并持久化
    function loadConversationId() {
        let id = localStorage.getItem(STORAGE_KEY);
        if (!id) {
            id = genConversationId();
            localStorage.setItem(STORAGE_KEY, id);
        }
        return id;
    }

    let conversationId = loadConversationId();

    function addMessage(text, who) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + who;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = who === 'me' ? '我' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return bubble;
    }

    function setBusy(v) {
        busy = v;
        sendBtn.disabled = v;
        inputEl.disabled = v;
    }

    async function send(text) {
        const content = (text !== undefined ? text : inputEl.value).trim();
        if (!content || busy) return;

        addMessage(content, 'me');
        inputEl.value = '';
        inputEl.style.height = 'auto';
        setBusy(true);

        // 先放占位提示：模型调工具期间会有数秒无任何输出，用它告诉用户"正在处理"
        const bubble = addMessage('正在处理…', 'bot');
        let acc = '';          // 已累积的文本
        let gotFirst = false;  // 是否已收到过内容（用于替换占位提示）

        // 消费一个 SSE 帧。
        // 实测确认 Spring MVC 写出的格式为 data:<值>（冒号后**无**空格），
        // 值内的换行会被拆成多行 data:，因此这里把多行按顺序拼回。
        function consumeFrame(frame) {
            if (frame === '') return;
            const piece = frame.split('\n')
                .map(line => line.startsWith('data:') ? line.slice(5) : line)
                .join('\n');
            if (piece === '') return;

            if (!gotFirst) { bubble.textContent = ''; gotFirst = true; }

            // 后端在流中途失败时会推一条以该前缀开头的提示，需与正文分隔并标色
            if (piece.startsWith('[流式输出中断：')) {
                acc += (acc ? '\n\n' : '') + piece;
                bubble.style.color = '#b42318';
            } else {
                acc += piece;
                bubble.style.color = '';
            }
            bubble.textContent = acc;
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        try {
            const resp = await fetch('/api/agent/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // 每次请求都带当前会话 ID，后端据此隔离/拼接历史
                body: JSON.stringify({ message: content, conversationId: conversationId })
            });
            if (!resp.ok) {
                throw new Error('HTTP ' + resp.status);
            }
            if (!resp.body) {
                throw new Error('当前浏览器不支持流式读取');
            }

            const reader = resp.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';   // 尚未成帧的残留

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                // stream: true 让跨 chunk 截断的多字节 UTF-8 字符能正确拼接
                buffer += decoder.decode(value, { stream: true });

                // SSE 以空行分帧
                let sep;
                while ((sep = buffer.indexOf('\n\n')) >= 0) {
                    const frame = buffer.slice(0, sep);
                    buffer = buffer.slice(sep + 2);
                    consumeFrame(frame);
                }
            }
            // 收尾：处理未以空行结束的尾帧
            if (buffer.trim() !== '') {
                consumeFrame(buffer);
            }
            if (!acc) {
                bubble.textContent = '（模型未返回内容）';
            }
        } catch (e) {
            // 已流出的内容尽量保留，仅在末尾追加错误提示
            bubble.textContent = (acc ? acc + '\n\n' : '') + '请求失败：' + e.message +
                '\n请确认后端已启动、AI_DASHSCOPE_API_KEY 已配置且有效。';
            bubble.style.color = '#b42318';
        } finally {
            setBusy(false);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
    }

    sendBtn.addEventListener('click', () => send());

    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });

    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
    });

    document.getElementById('chips').addEventListener('click', e => {
        if (e.target.classList.contains('chip')) {
            send(e.target.textContent);
        }
    });

    // 新对话：清理后端旧会话内存 -> 生成并保存新 ID -> 清空消息区 -> 重新欢迎
    async function resetConversation() {
        const oldId = conversationId;
        try {
            await fetch('/api/agent/conversation?conversationId=' + encodeURIComponent(oldId),
                { method: 'DELETE' });
        } catch (e) { /* 后端清理失败也不阻断前端重置 */ }
        conversationId = genConversationId();
        localStorage.setItem(STORAGE_KEY, conversationId);
        messagesEl.innerHTML = '';
        addMessage('已开启新对话。你可以继续查询、新增、改价或删除商品～', 'bot');
    }

    document.getElementById('newChat').addEventListener('click', resetConversation);

    addMessage('你好，我是商品管理助手。你可以让我查询、新增、改价或删除商品，试试下面的示例～', 'bot');
</script>
</body>
</html>
