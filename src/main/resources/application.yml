server:
  port: 8080

spring:
  application:
    name: spring-ai-agent-crud-demo

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  # 启动时自动执行 schema.sql / data.sql（脚本本身幂等，可反复启动）
  sql:
    init:
      mode: always
      continue-on-error: true
      encoding: UTF-8

  # ★ 流式输出（SSE）必配：MVC 异步请求默认超时仅 30 秒，长回答会被直接截断
  mvc:
    async:
      request-timeout: 300000   # 5 分钟（毫秒）

  # Redis：多轮会话记忆 + RAG 向量库（同一实例，不同 key 前缀隔离）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      # 降级判定依赖这个超时，别调太大：Redis 挂掉时每次探活都要等它
      timeout: 2000ms
      # 需要密码时再启用（★ 不要写成 ${REDIS_PASSWORD:}：空串会被绑成 RedisPassword.of("")，
      # 在未设密码的 Redis 上会触发 "ERR Client sent AUTH, but no password is set"）
      password: ${REDIS_PASSWORD:123456}
      # ★ 显式声明使用 Jedis。说明：Spring Boot 的 JedisConnectionConfiguration 本身带
      #   matchIfMissing=true，jedis 一旦在 classpath 就会默认胜出；这里显式写出是为了
      #   让「为什么是 Jedis」在配置里可见。Jedis 与 Lettuce 是二选一（RedisConnectionFactory
      #   单例），故会话记忆的 StringRedisTemplate 也跑在 Jedis 上（功能透明）。
      #   必须用 Jedis 的原因：RedisVectorStore 需要 JedisPooled。
      client-type: jedis

  ai:
    dashscope:
      # ★ 必填：阿里云百炼 API Key，通过环境变量 AI_DASHSCOPE_API_KEY 注入
      #    获取地址：https://bailian.console.aliyun.com  ->  API-KEY 管理
      #    默认值仅用于占位，不配置时应用仍可启动，但调用 Agent 会返回鉴权错误
      api-key: ${AI_DASHSCOPE_API_KEY:sk-please-set-your-dashscope-api-key}
      chat:
        options:
          # 工具调用（Function Calling）稳定性最佳；若想省钱可换 qwen-plus 实测
          model: deepseek-v4-flash-0731
          temperature: 0.3

      # RAG 的向量化模型。自动装配条件为
      # @ConditionalOnProperty(name="spring.ai.model.embedding.text",
      #                        havingValue="dashscope", matchIfMissing=true)
      # → 默认即装配 DashScopeEmbeddingModel，无需额外依赖。
      # 显式写出是为了固定模型与维度，避免默认值变动带来的不确定性。
      embedding:
        options:
          model: qwen3.7-text-embedding   # 该模型默认维度 1024
          dimensions: 1024

    # RAG 向量库（Redis Stack）。要求 Redis 具备 RediSearch / RedisJSON 模块
    # ——必须用 redis/redis-stack 镜像，普通 redis 会报 unknown command 'FT.CREATE'
    vectorstore:
      redis:
        # ★ 必须显式开启：默认 false，不开则索引不创建，首次 add() 会失败。
        # 幂等：内部先 FT.INFO 探测，索引已存在则跳过 FT.CREATE，反复重启安全。
        # 注意：该动作发生在应用启动期，Redis 不在线会导致启动失败（见 README 说明）。
        initialize-schema: true
        index-name: agent-knowledge-index
        # key 前缀，与会话记忆的 "agent:chat:memory:" 物理隔离（严禁设为空或与之重叠）
        prefix: "agent:kb:"

    # ========== MCP（Model Context Protocol）==========
    mcp:
      # ----- Client：以 stdio 方式拉起本地 filesystem MCP Server，把远程工具并入 ChatClient -----
      client:
        # 总开关：子进程环境不可用时（如服务器上没装 Node）可整体关闭，
        # 关闭后 ChatClientConfig 拿不到 McpSyncClient，自动按无 MCP 工具装配，应用照常启动
        enabled: ${MCP_CLIENT_ENABLED:true}
        type: SYNC
        name: agent-crud-demo-mcp-client
        # 单次工具调用超时：filesystem 本地操作很快，30s 足够
        request-timeout: 30s
        # ★ 关键防串扰：默认 true 时框架会把 SyncMcpToolCallbackProvider 注册为容器 Bean，
        #   而本进程 MCP Server 的 ToolCallbackConverterAutoConfiguration 会收集
        #   【容器中全部 ToolCallbackProvider Bean】对外暴露 → filesystem 远程工具会被
        #   本 Server 重复暴露。故关闭自动注册，MCP 工具改由 ChatClientConfig 手工构建
        #   provider（不作为 Bean）接入 ChatClient。
        toolcallback:
          enabled: false
        stdio:
          connections:
            filesystem:
              # ★ 预装 node_modules + node.exe 绝对路径，绕开 Windows 两个坑：
              #   (1) Java ProcessBuilder 无法直接执行 npx(.cmd 批处理)，必须 cmd /c 包一层；
              #   (2) 应用启动期首次 npx 下载有分钟级延迟与网络不确定性。
              command: "E:/nodejs/node.exe"
              args:
                - "E:/workbuddy-space/agent/spring-ai-agent-crud-demo/mcp-servers/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js"
                # filesystem server 的允许访问根目录（位置参数，必须）：
                # 该目录之外的文件操作都会被 server 拒绝
                - "E:/workbuddy-space/agent/spring-ai-agent-crud-demo/data/mcp-fs-root"

      # ----- Server：把本地 6 个 @Tool 暴露给外部 MCP 客户端 -----
      server:
        enabled: true
        name: agent-crud-demo-mcp-server
        version: 0.0.1
        type: SYNC
        # ★ 传输协议：STREAMABLE = MCP 新规范的 Streamable HTTP（客户端只配一个 URL 即可用）。
        #   WebMvc 侧由 McpServerStreamableHttpWebMvcAutoConfiguration 提供，
        #   端点 = spring.ai.mcp.server.streamable-http.mcp-endpoint（默认 /mcp）。
        #
        #   为什么从 SSE 改为 STREAMABLE：
        #   SSE 是老式传输，必须「先 GET /sse 建长连接拿 sessionId，再 POST 到 message 端点」；
        #   多数现代 MCP 客户端（如 WorkBuddy / Claude Desktop）只给一个 URL 时会按
        #   Streamable HTTP 去连 —— POST /mcp 期待直接拿响应。用 SSE 模式对接必然失败：
        #   实测不带 sessionId 的 POST /mcp/message 会返回 400
        #   "Session ID missing in message endpoint"，客户端因此拿不到工具列表，
        #   模型上下文里没有工具 → 只会「自由发挥」而不是发起工具调用。
        protocol: STREAMABLE
        stdio: false           # WebMvc 传输要求非 stdio 模式（默认即 false，显式写出防误开）
        instructions: "商品管理 CRUD 与知识库检索工具服务"
        # searchKnowledgeBase 会实时调 embedding（跨公网），默认 20s 偏紧
        request-timeout: 60s
        # Streamable HTTP 端点（客户端配置 http://localhost:8080/mcp 即可）
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s
        # SSE 端点保留（老客户端兼容）：改协议后这两个端点不再注册，
        # 若需回退 SSE 只需把上面 protocol 改回 SSE 并重启即可
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
        keep-alive-interval: 30s
        capabilities:
          tool: true
          resource: false      # 未提供的能力显式关掉，避免对客户端误通告
          prompt: false
          completion: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 打印 SQL 日志，便于观察 Agent 到底执行了哪条 CRUD
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 多轮会话记忆（自定义配置）
app:
  chat-memory:
    # redis = 持久化到 Redis（默认）；memory = 退回进程内实现（重启即丢，便于本地调试）
    type: redis
    # Redis key 前缀，最终 key = key-prefix + conversationId
    key-prefix: "agent:chat:memory:"
    # 滑动过期：每次写入都会把该会话的 TTL 重置为该值（不是累加）
    time-to-live: 24h
    # Redis 不可用时是否降级为内存实现。false = 快速失败，让问题直接暴露
    fallback-to-memory: true
    # 降级后的探活冷却：期内不再尝试 Redis（避免每个请求都吃一次连接超时）
    retry-interval: 30s

  # RAG 知识库（自定义配置；刻意避开 spring.ai.* 前缀，防止与自动装配冲突）
  rag:
    # 上传文件的落盘目录（相对进程工作目录；不存在时由应用自动创建）
    storage-dir: "./data/kb-uploads"
    # 分片参数（TokenTextSplitter）
    chunk-size: 800
    min-chunk-size-chars: 350
    min-chunk-length-to-embed: 5
    max-num-chunks: 10000
    keep-separator: true
    # 检索默认参数
    default-top-k: 4
    default-similarity-threshold: 0.5
    # 单文件大小上限（字节），超过直接拒绝
    max-file-size: 20971520          # 20 MB
    # 单文件最大分片数，超过则截断并告警（防超大文档把 embedding 配额打光）
    max-chunks-per-document: 500
    # 向量库 Redis key 前缀，须与 spring.ai.vectorstore.redis.prefix 保持一致。
    # 仅用于删除时的兜底「按 key 前缀扫描孤儿分片」（清单缺失场景）。
    redis-key-prefix: "agent:kb:"
    # ★ 单次向量库写入的批量大小。DashScope text-embedding-v3 存在【两道上限】，
    #   必须取更小的那个：
    #   (1) SDK 本地断言 ≤ 25 条 → 超出抛 IllegalArgumentException
    #       "The input texts limit 25."（请求尚未发出，DashScopeApi:219）
    #   (2) 服务端校验 ≤ 10 条 → 超出返回 HTTP 400
    #       "batch size is invalid, it should not be larger than 10"（DashScopeApi:226）
    #   ★ 真正的硬上限是 10，25 只是本地前置断言够不着服务端限制。
    #     故此处取 10；两者均为不可重试错误（NonTransient）。
    #   换用其他 embedding 模型/服务商时须重新核对其批量上限。
    batch-size: 10

  # skill（技能/能力）系统（自定义配置；刻意避开 spring.ai.* 前缀）
  skill:
    # skill 根目录，其下每个子目录 = 一个 skill（内含 SKILL.md）
    root-dir: "./data/skills"
    # 总开关：false 时扫描/激活/脚本全部禁用
    enabled: true
    # 启动时立即扫描一次
    scan-on-startup: true
    # 热重载：定时轮询 SKILL.md 的 lastModified，变化才重扫（不用 WatchService，Windows 下不可靠）
    hot-reload-enabled: true
    hot-reload-interval: 10s
    # 单脚本执行超时（超时强制杀进程）
    script-timeout: 30s
    # 脚本输出截断阈值
    script-max-output-chars: 8000
    # 脚本参数个数上限
    script-max-args: 8
    # 脚本并发上限
    script-max-concurrent: 2
    # 会话激活态 TTL（无交互超过此时长后惰性回收）
    session-ttl: 1h
    # 基础系统提示词：留空则用内置默认
    base-system-prompt: ""
    # 脚本解释器映射（扩展名 -> 可执行名），留空用内置默认(.py->python/.sh->bash/.bat->cmd)
    script-interpreters: {}

logging:
  level:
    com.example.agentdemo: debug
